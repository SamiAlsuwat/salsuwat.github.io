const LoginPage = ({ onNavigate, onLogin }) => {

const RegisterPage = ({ onRegister, onNavigate }) => {
  const [form, setForm] = useState({ studentName: '', studentNumber: '', sectionNumber: '1512', password: '', confirmPassword: '' });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setSuccess('');
    
    if (form.password !== form.confirmPassword) {
      setError('Passwords do not match | كلمات المرور غير متطابقة');
      return;
    }
    if (form.studentNumber.length !== 8) {
      setError('Student number must be 8 digits | الرقم الجامعي يجب أن يكون 8 أرقام');
      return;
    }
    if (form.password.length < 4) {
      setError('Password must be at least 4 characters | كلمة المرور يجب أن تكون 4 أحرف على الأقل');
      return;
    }

    setLoading(true);
    try {
      const result = await onRegister(form);
      if (result === true) {
        setSuccess('Registration successful! Redirecting... | تم التسجيل بنجاح! جاري التحويل...');
      } else {
        setError('Student number already exists | الرقم الجامعي مسجل مسبقاً');
      }
    } catch (err) {
      setError('Registration failed. Please try again. | فشل التسجيل. حاول مرة أخرى.');
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-amber-900/20 to-slate-900 flex items-center justify-center p-4">
      <div className="bg-slate-800/50 backdrop-blur rounded-2xl p-8 w-full max-w-md border border-slate-700">
        <div className="text-center mb-8">
          <div className="w-16 h-16 bg-amber-600 rounded-xl flex items-center justify-center mx-auto mb-4">
            <span className="text-white font-black text-xl">DB</span>
          </div>
          <h1 className="text-2xl font-bold text-white">Register</h1>
          <p className="text-amber-300/70 font-arabic">تسجيل حساب جديد</p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          {error && (
            <div className="bg-red-500/20 border border-red-500/50 rounded-lg p-3 text-red-300 text-sm flex items-center gap-2">
              <span>❌</span> {error}
            </div>
          )}
          {success && (
            <div className="bg-emerald-500/20 border border-emerald-500/50 rounded-lg p-3 text-emerald-300 text-sm flex items-center gap-2">
              <span>✅</span> {success}
            </div>
          )}
          
          <div>
            <label className="block text-slate-300 text-sm mb-2">Full Name | الاسم الكامل</label>
            <input type="text" value={form.studentName} onChange={(e) => setForm({...form, studentName: e.target.value})} className="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" required disabled={loading} />
          </div>

          <div>
            <label className="block text-slate-300 text-sm mb-2">Student Number (8 digits) | الرقم الجامعي</label>
            <input type="text" value={form.studentNumber} onChange={(e) => setForm({...form, studentNumber: e.target.value.replace(/\D/g, '').slice(0, 8)})} className="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" required disabled={loading} />
          </div>

          <div>
            <label className="block text-slate-300 text-sm mb-2">Section | الشعبة</label>
            <select value={form.sectionNumber} onChange={(e) => setForm({...form, sectionNumber: e.target.value})} className="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" disabled={loading}>
              <option value="1512">1512</option>
              <option value="1515">1515</option>
              <option value="572">572</option>
              <option value="629">629</option>
              <option value="650">650</option>
              <option value="651">651</option>
            </select>
          </div>

          <div>
            <label className="block text-slate-300 text-sm mb-2">Password | كلمة المرور</label>
            <input type="password" value={form.password} onChange={(e) => setForm({...form, password: e.target.value})} className="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" required disabled={loading} />
          </div>

          <div>
            <label className="block text-slate-300 text-sm mb-2">Confirm Password | تأكيد كلمة المرور</label>
            <input type="password" value={form.confirmPassword} onChange={(e) => setForm({...form, confirmPassword: e.target.value})} className="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500" required disabled={loading} />
          </div>

          <button type="submit" disabled={loading} className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            {loading ? (
              <>
                <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                Registering...
              </>
            ) : (
              'Register | تسجيل'
            )}
          </button>
        </form>

        <p className="text-center text-slate-400 mt-6">
          Already have an account? <button onClick={() => onNavigate('login')} className="text-amber-400 hover:underline">Login</button>
        </p>
      </div>
    </div>
  );
};

const AdminDashboard = ({ students, onNavigate, onLogout, onRefresh }) => {
  const [searchTerm, setSearchTerm] = useState('');
  const [sortBy, setSortBy] = useState('name');
  const [filterSection, setFilterSection] = useState('all');
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [refreshing, setRefreshing] = useState(false);

  const weeks = [
    { week: 1, titleEn: "Introduction to Databases" },
    { week: 2, titleEn: "Creating a Database" },
    { week: 3, titleEn: "Creating Tables (Part 1)" },
    { week: 4, titleEn: "Creating Tables (Part 2)" },
    { week: 5, titleEn: "Creating Tables (Part 3)" },
    { week: 6, titleEn: "Inserting Data (Part 1)" },
    { week: 7, titleEn: "Inserting Data (Part 2)" },
    { week: 8, titleEn: "Query Basics (Part 1)" },
    { week: 9, titleEn: "Query Basics (Part 2)" },
    { week: 10, titleEn: "Advanced Queries (Part 1)" },
    { week: 11, titleEn: "Advanced Queries (Part 2)" },
    { week: 12, titleEn: "Database Design & Normalization" },
  ];

  // Get unique sections
  const sections = useMemo(() => {
    if (!students || students.length === 0) return ['all'];
    const sectionSet = new Set(students.map(s => s.sectionNumber));
    return ['all', ...Array.from(sectionSet).sort()];
  }, [students]);

  // Filter and sort students
  const filteredStudents = useMemo(() => {
    if (!students || students.length === 0) return [];
    let result = [...students];

    // Filter by search
    if (searchTerm) {
      const term = searchTerm.toLowerCase();
      result = result.filter(s => 
        s.studentName?.toLowerCase().includes(term) ||
        s.studentNumber?.toLowerCase().includes(term)
      );
    }

    // Filter by section
    if (filterSection !== 'all') {
      result = result.filter(s => s.sectionNumber === filterSection);
    }

    // Sort
    result.sort((a, b) => {
      switch (sortBy) {
        case 'name':
          return (a.studentName || '').localeCompare(b.studentName || '');
        case 'id':
          return (a.studentNumber || '').localeCompare(b.studentNumber || '');
        case 'grade':
          return (b.totalScore || 0) - (a.totalScore || 0);
        case 'progress':
          const aProgress = a.progress ? Object.values(a.progress).filter(w => w.completed).length : 0;
          const bProgress = b.progress ? Object.values(b.progress).filter(w => w.completed).length : 0;
          return bProgress - aProgress;
        default:
          return 0;
      }
    });

    return result;
  }, [students, searchTerm, sortBy, filterSection]);

  // Calculate statistics
  const stats = useMemo(() => {
    if (!students || students.length === 0) return { total: 0, avgScore: 0, avgProgress: 0, gradeDistribution: {} };

    const totalScore = students.reduce((sum, s) => sum + (s.totalScore || 0), 0);
    const totalProgress = students.reduce((sum, s) => {
      const completed = s.progress ? Object.values(s.progress).filter(w => w.completed).length : 0;
      return sum + (completed / 12) * 100;
    }, 0);

    const gradeDistribution = { 'A+': 0, 'A': 0, 'B+': 0, 'B': 0, 'C+': 0, 'C': 0, 'D+': 0, 'D': 0, 'F': 0, 'N/A': 0 };
    students.forEach(s => {
      const grade = s.overallGrade || 'N/A';
      if (gradeDistribution.hasOwnProperty(grade)) {
        gradeDistribution[grade]++;
      }
    });

    return {
      total: students.length,
      avgScore: students.length > 0 ? Math.round(totalScore / students.length) : 0,
      avgProgress: students.length > 0 ? Math.round(totalProgress / students.length) : 0,
      gradeDistribution
    };
  }, [students]);

  const getGradeColor = (grade) => {
    if (grade === 'A+' || grade === 'A') return 'text-emerald-400';
    if (grade === 'B+' || grade === 'B') return 'text-blue-400';
    if (grade === 'C+' || grade === 'C') return 'text-yellow-400';
    if (grade === 'D+' || grade === 'D') return 'text-orange-400';
    if (grade === 'F') return 'text-red-400';
    return 'text-slate-400';
  };

  const getGradeBg = (grade) => {
    if (grade === 'A+' || grade === 'A') return 'bg-emerald-500/20 border-emerald-500/50';
    if (grade === 'B+' || grade === 'B') return 'bg-blue-500/20 border-blue-500/50';
    if (grade === 'C+' || grade === 'C') return 'bg-yellow-500/20 border-yellow-500/50';
    if (grade === 'D+' || grade === 'D') return 'bg-orange-500/20 border-orange-500/50';
    if (grade === 'F') return 'bg-red-500/20 border-red-500/50';
    return 'bg-slate-500/20 border-slate-500/50';
  };

  const getScoreColor = (score) => {
    if (score >= 90) return 'text-emerald-400';
    if (score >= 75) return 'text-blue-400';
    if (score >= 60) return 'text-yellow-400';
    if (score >= 50) return 'text-orange-400';
    return 'text-red-400';
  };

            {['A+', 'A', 'B+', 'B', 'C+', 'C', 'D+', 'D', 'F'].map(grade => (

                <span className="text-slate-400 text-sm">({stats.gradeDistribution[grade] || 0})</span>
              </div>
            ))}
          </div>
        </div>

          <div className="flex flex-col md:flex-row gap-4">
            {/* Search */}

              <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                type="text"
                placeholder="Search by name or ID..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}

              onChange={e => setFilterSection(e.target.value)}

              {sections.map(section => (
                <option key={section} value={section}>
                  {section === 'all' ? 'All Sections' : `Section ${section}`}

              ))}
            </select>

            <select

              onChange={e => setSortBy(e.target.value)}

                className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm transition-colors"

          ) : (
            <div className="overflow-x-auto">

                    <th className="text-center px-4 py-3 text-sm font-medium text-slate-400">Progress</th>
                    <th className="text-center px-4 py-3 text-sm font-medium text-slate-400">Score</th>
                    <th className="text-center px-4 py-3 text-sm font-medium text-slate-400">Grade</th>
                    <th className="text-right px-4 py-3 text-sm font-medium text-slate-400">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-700/50">
                  {filteredStudents.map(student => {
                    const completedWeeks = student.progress
                      ? Object.entries(student.progress)
                          .filter(([key, val]) => val.completed && parseInt(key.replace('week', '')) <= 12)
                          .length
                      : 0;
                    const progressPercent = Math.round((completedWeeks / 12) * 100);

                    return (
                      <tr key={student.id || student.studentNumber} className="hover:bg-slate-700/30 transition-colors">
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-amber-600 rounded-full flex items-center justify-center text-white font-bold text-sm">
                              {student.studentName?.charAt(0) || '?'}
                            </div>
                            <div>
                              <p className="text-white font-medium">{student.studentName}</p>
                              <p className="text-slate-400 text-xs font-mono">{student.studentNumber}</p>
                            </div>
                          </div>
                        </td>
                        <td className="px-4 py-3">
                          <span className="px-2 py-1 bg-slate-700 rounded text-amber-400 text-sm">{student.sectionNumber}</span>
                        </td>
                        <td className="px-4 py-3">
                          <div className="flex items-center justify-center gap-2">
                            <div className="w-24 h-2 bg-slate-700 rounded-full overflow-hidden">
                              <div 
                                className="h-full bg-gradient-to-r from-amber-500 to-amber-400 transition-all" 
                                style={{ width: `${progressPercent}%` }} 
                              />
                            </div>
                            <span className="text-slate-400 text-sm">{completedWeeks}/12</span>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-center">
                          <span className={`font-semibold ${getScoreColor(student.totalScore || 0)}`}>
                            {student.totalScore || 0}%
                          </span>
                        </td>
                        <td className="px-4 py-3 text-center">
                          <span className={`px-3 py-1 rounded-full text-sm font-bold border ${getGradeBg(student.overallGrade || 'N/A')} ${getGradeColor(student.overallGrade || 'N/A')}`}>
                            {student.overallGrade || 'N/A'}
                          </span>
                        </td>
                        <td className="px-4 py-3 text-right">
                          <button
                            onClick={() => setSelectedStudent(student)}
                            className="px-3 py-1.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 rounded-lg text-sm transition-colors"
                          >
                            View Details
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>

      {/* Footer */}
      <footer className="py-6 text-center border-t border-slate-800 mt-8">
        <p className="text-slate-500 text-sm">0502241-3 | Taif University | جامعة الطائف</p>
        <p className="text-slate-600 text-xs mt-2">Admin Dashboard - College of Computers & Information Technology</p>
      </footer>

      {/* Student Detail Modal */}
      {selectedStudent && (
        <StudentDetailModal student={selectedStudent} onClose={() => setSelectedStudent(null)} />
      )}
    </div>
  );
};

          <div className="flex items-center gap-3">
            <button
              onClick={() => onNavigate('home')}
              className="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm"
            >
              ← Back
            </button>
            <div>
              <h1 className="font-bold text-white">Week {weekNum}: {week.titleEn}</h1>
              <p className="text-xs text-amber-300/70 font-arabic">{week.titleAr}</p>
            </div>
          </div>
          <span className="text-3xl">{week.icon}</span>
        </div>
      </header>

      {/* Progress */}
      {!showExercise && (
        <div className="bg-slate-800/50 border-b border-slate-700">
          <div className="max-w-6xl mx-auto px-4 py-2">
            <div className="flex items-center justify-between text-sm text-slate-400 mb-1">
              <span>Step {currentStep + 1} of {totalSteps}</span>
              <span>{Math.round(((currentStep + 1) / totalSteps) * 100)}%</span>
            </div>
            <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
              <div 
                className="h-full bg-gradient-to-r from-amber-500 to-amber-400 transition-all"
                style={{ width: `${((currentStep + 1) / totalSteps) * 100}%` }}
              />
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div className="flex-1 max-w-6xl mx-auto w-full overflow-y-auto">
        {renderContent()}
      </div>

      {/* Navigation */}
      {!showExercise && (
        <div className="bg-slate-800/80 border-t border-slate-700 p-4 sticky bottom-0">
          <div className="max-w-6xl mx-auto flex justify-between">
            <button
              onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
              disabled={currentStep === 0}
              className={`px-6 py-2 rounded-lg ${currentStep === 0 ? 'bg-slate-700 text-slate-500' : 'bg-slate-700 text-white hover:bg-slate-600'}`}
            >
              ← Previous
            </button>
            
            {currentStep < totalSteps - 1 ? (
              <button
                onClick={() => setCurrentStep(currentStep + 1)}
                className="px-6 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg"
              >
                Next →
              </button>
            ) : (
              <button
                onClick={() => setShowExercise(true)}
                className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg"
              >
                📝 Take Exercise
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
};


    // ---- App ----

const App = () => {
  const [currentPage, setCurrentPage] = useState('login');
  const [currentUser, setCurrentUser] = useState(null);
  const [students, setStudents] = useState([]);
  const [isAdmin, setIsAdmin] = useState(false);
  const [loading, setLoading] = useState(true);

  // Load students from Supabase on mount
  useEffect(() => {
    const initApp = async () => {
      await loadStudents();
      
      // Check for saved user session
      try {
        const savedUser = localStorage.getItem('taif_db_current_user');
        if (savedUser) {
          const parsedUser = JSON.parse(savedUser);
          // Verify user still exists in database
          const { data: verifiedUser, error } = await supabase
            .from('students')
            .select('*')
            .eq('id', parsedUser.id)
            .single();
          
          if (verifiedUser && !error) {
            // Update with fresh data from database
            const freshUser = {
              id: verifiedUser.id,
              studentNumber: verifiedUser.student_number,
              studentName: verifiedUser.student_name,
              password: verifiedUser.password,
              sectionNumber: verifiedUser.section_number,
              progress: verifiedUser.progress || getInitialProgress(),
              totalScore: verifiedUser.total_score || 0,
              overallGrade: verifiedUser.overall_grade || 'N/A',
              registeredAt: verifiedUser.registered_at
            };
            setCurrentUser(freshUser);
            localStorage.setItem('taif_db_current_user', JSON.stringify(freshUser));
            setCurrentPage('home');
          } else {
            // Clear invalid session
            localStorage.removeItem('taif_db_current_user');
          }
        }
      } catch (err) {
        console.error('Error restoring session:', err);
        localStorage.removeItem('taif_db_current_user');
      }
      
      setLoading(false);
    };
    
    initApp();
  }, []);

  // Load all students from Supabase
  const loadStudents = async () => {
    try {
      const { data, error } = await supabase
        .from('students')
        .select('*')
        .order('registered_at', { ascending: false });

      if (error) {
        console.error('Error loading students:', error);
        return;
      }

      // Transform data to match our app structure
      const transformedStudents = data.map(student => ({
        id: student.id,
        studentNumber: student.student_number,
        studentName: student.student_name,
        password: student.password,
        sectionNumber: student.section_number,
        progress: student.progress || getInitialProgress(),
        totalScore: student.total_score || 0,
        overallGrade: student.overall_grade || 'N/A',
        registeredAt: student.registered_at
      }));

      setStudents(transformedStudents);
      console.log('Loaded', transformedStudents.length, 'students from Supabase');
    } catch (err) {
      console.error('Failed to load students:', err);
    }
  };

  // Get initial progress structure
  const getInitialProgress = () => ({
    week1: { completed: false, score: 0, attempts: 0 },
    week2: { completed: false, score: 0, attempts: 0 },
    week3: { completed: false, score: 0, attempts: 0 },
    week4: { completed: false, score: 0, attempts: 0 },
    week5: { completed: false, score: 0, attempts: 0 },
    week6: { completed: false, score: 0, attempts: 0 },
    week7: { completed: false, score: 0, attempts: 0 },
    week8: { completed: false, score: 0, attempts: 0 },
    week9: { completed: false, score: 0, attempts: 0 },
    week10: { completed: false, score: 0, attempts: 0 },
    week11: { completed: false, score: 0, attempts: 0 },
    week12: { completed: false, score: 0, attempts: 0 },
    week13: { completed: false, score: 0, attempts: 0 },
  });

  // Save current user to localStorage
  useEffect(() => {
    if (currentUser) {
      localStorage.setItem('taif_db_current_user', JSON.stringify(currentUser));
    }
  }, [currentUser]);

  const handleNavigate = (page) => {
    setCurrentPage(page);
    window.scrollTo(0, 0);
  };

  const handleRegister = async (studentData) => {
    try {
      // Check if student number already exists
      const { data: existing, error: checkError } = await supabase
        .from('students')
        .select('student_number')
        .eq('student_number', studentData.studentNumber)
        .maybeSingle();

      if (existing) {
        return { success: false, message: 'Student number already registered! | الرقم الجامعي مسجل بالفعل!' };
      }

      // Insert new student into Supabase
      const { data, error } = await supabase
        .from('students')
        .insert([{
          student_number: studentData.studentNumber,
          student_name: studentData.studentName,
          password: studentData.password,
          section_number: studentData.sectionNumber,
          progress: getInitialProgress(),
          total_score: 0,
          overall_grade: 'N/A'
        }])
        .select()
        .single();

      if (error) {
        console.error('Registration error:', error);
        return { success: false, message: 'Registration failed. Please try again. | فشل التسجيل. حاول مرة أخرى.' };
      }

      // Reload students list
      await loadStudents();

      return { success: true, message: 'Registration successful! | تم التسجيل بنجاح!' };
    } catch (err) {
      console.error('Registration error:', err);
      return { success: false, message: 'Registration failed. Please try again. | فشل التسجيل. حاول مرة أخرى.' };
    }
  };

  const handleLogin = async (studentNumber, password) => {
    // Admin login check
    if (studentNumber === 'admin' && password === 'Saad@1234') {
      setIsAdmin(true);
      await loadStudents(); // Refresh students list for admin
      setCurrentPage('admin');
      return { success: true };
    }

    try {
      // Find student in Supabase
      const { data: student, error } = await supabase
        .from('students')
        .select('*')
        .eq('student_number', studentNumber)
        .eq('password', password)
        .maybeSingle();

      if (error) {
        console.error('Login query error:', error);
        return { success: false, message: 'Login failed. Please try again. | فشل تسجيل الدخول. حاول مرة أخرى.' };
      }

      if (!student) {
        return { success: false, message: 'Invalid student number or password! | الرقم الجامعي أو كلمة المرور غير صحيحة!' };
      }

      // Transform to app structure
      const transformedStudent = {
        id: student.id,
        studentNumber: student.student_number,
        studentName: student.student_name,
        password: student.password,
        sectionNumber: student.section_number,
        progress: student.progress || getInitialProgress(),
        totalScore: student.total_score || 0,
        overallGrade: student.overall_grade || 'N/A',
        registeredAt: student.registered_at
      };

      setCurrentUser(transformedStudent);
      setCurrentPage('home');
      return { success: true };
    } catch (err) {
      console.error('Login error:', err);
      return { success: false, message: 'Login failed. Please try again. | فشل تسجيل الدخول. حاول مرة أخرى.' };
    }
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setIsAdmin(false);
    localStorage.removeItem('taif_db_current_user');
    setCurrentPage('login');
  };

  const calculateGrade = (score) => {
    if (score >= 90) return 'A+';
    if (score >= 85) return 'A';
    if (score >= 80) return 'B+';
    if (score >= 75) return 'B';
    if (score >= 70) return 'C+';
    if (score >= 65) return 'C';
    if (score >= 60) return 'D+';
    if (score >= 50) return 'D';
    return 'F';
  };

  const handleExerciseComplete = async (weekNum, score) => {
    if (!currentUser) return;

    const weekKey = `week${weekNum}`;
    
    // Calculate new progress
    const newProgress = {
      ...currentUser.progress,
      [weekKey]: {
        completed: true,
        score: Math.max(currentUser.progress[weekKey]?.score || 0, score),
        attempts: (currentUser.progress[weekKey]?.attempts || 0) + 1,
        completedAt: new Date().toISOString()
      }
    };

    // Calculate total score (average of all completed weeks)
    const completedWeeks = Object.values(newProgress).filter(w => w.completed);
    const totalScore = completedWeeks.length > 0
      ? Math.round(completedWeeks.reduce((sum, w) => sum + w.score, 0) / completedWeeks.length)
      : 0;
    const overallGrade = calculateGrade(totalScore);

    try {
      // Update in Supabase
      const { error } = await supabase
        .from('students')
        .update({
          progress: newProgress,
          total_score: totalScore,
          overall_grade: overallGrade
        })
        .eq('id', currentUser.id);

      if (error) {
        console.error('Error updating progress:', error);
        return;
      }

      // Update local state
      const updatedUser = {
        ...currentUser,
        progress: newProgress,
        totalScore,
        overallGrade
      };

      setCurrentUser(updatedUser);

      // Update students list
      setStudents(students.map(s => 
        s.id === currentUser.id ? updatedUser : s
      ));

    } catch (err) {
      console.error('Error updating progress:', err);
    }
  };

  // Loading screen
  if (loading) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-amber-900/30 flex items-center justify-center">
        <div className="text-center">
          <div className="w-16 h-16 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
          <p className="text-white text-lg">Loading...</p>
        </div>
      </div>
    );
  }

  const renderPage = () => {
    // Admin dashboard
    if (isAdmin && currentPage === 'admin') {
      return <AdminDashboard students={students} onNavigate={handleNavigate} onLogout={handleLogout} onRefresh={loadStudents} />;
    }

    if (!currentUser && currentPage !== 'login' && currentPage !== 'register') {
      return <LoginPage onNavigate={handleNavigate} onLogin={handleLogin} />;
    }

    switch (currentPage) {
      case 'login':
        return <LoginPage onNavigate={handleNavigate} onLogin={handleLogin} />;
      case 'register':
        return <RegisterPage onNavigate={handleNavigate} onRegister={handleRegister} />;
      case 'home':
        return <HomePage user={currentUser} onNavigate={handleNavigate} onLogout={handleLogout} />;
      case 'profile':
        return <ProfilePage user={currentUser} onNavigate={handleNavigate} onLogout={handleLogout} />;
      case 'week1':
      case 'week2':
      case 'week3':
      case 'week4':
      case 'week5':
      case 'week6':
      case 'week7':
      case 'week8':
      case 'week9':
      case 'week10':
      case 'week11':
      case 'week12':
      case 'week13':
        const weekNum = parseInt(currentPage.replace('week', ''));
        return (
          <WeekLesson 
            weekNum={weekNum} 
            user={currentUser}
            onNavigate={handleNavigate} 
            onExerciseComplete={handleExerciseComplete}
            onLogout={handleLogout}
          />
        );
      default:
        return <HomePage user={currentUser} onNavigate={handleNavigate} onLogout={handleLogout} />;
    }
  };

  return (
    <div className="min-h-screen">
      {renderPage()}
    </div>
  );
};


    // ============================================================
    //  Mount
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
